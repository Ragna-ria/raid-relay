<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>レイドでつなぐ生誕祭 管理画面</title>

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="container">

<h1 id="eventTitle">レイドでつなぐ生誕祭</h1>

<div class="card">

<h2>イベント</h2>

<select id="eventSelect"></select>

</div>

<div class="card">

<h2>走者一覧</h2>

<div id="runnerList"></div>

<div class="buttons">

<button id="addRunnerButton">
＋走者追加
</button>

</div>

</div>

<div class="card">

<h2>現在</h2>

<p id="currentRunnerName">-</p>

<h2>次</h2>

<p id="nextRunnerName">-</p>

</div>

<div class="buttons">

<button id="saveButton">
💾 保存
</button>

</div>

</div>

<script src="js/admin.js"></script>

</body>

</html>
