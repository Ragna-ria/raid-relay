<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>レイドリレー管理画面</title>

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="container">

<h1 id="eventTitle">レイドリレー管理画面</h1>

<div class="card">

<h2>イベント</h2>

<select id="eventSelect"></select>

</div>

<div class="card">

<h2>走者一覧</h2>

<div id="runnerList"></div>

<div class="buttons">

<button id="addRunnerButton" type="button">
＋走者追加
</button>

</div>

</div>

<div class="card">

<h2>現在</h2>

<p id="currentRunnerName">-</p>

<h2>次</h2>

<p id="nextRunnerName">-</p>

<div class="buttons">

<button id="previousButton" type="button">
◀ 前へ
</button>

<button id="advanceButton" type="button">
次へ ▶
</button>

</div>

</div>

<div class="card">

<h2>EventSub状態</h2>

<div class="buttons">

<button id="eventSubStatusButton" type="button">
🔄 状態確認
</button>

</div>

<div id="eventSubStatus">

<p>
状態：
<span id="eventSubSyncStatus">未確認</span>
</p>

<p>
購読：
<span id="eventSubSubscriptionStatus">-</span>
</p>

<p>
現在走者：
<span id="eventSubCurrentRunner">-</span>
</p>

<p>
チャンネル：
<span id="eventSubCurrentChannel">-</span>
</p>

<p>
コールバック：
<span id="eventSubCallback">-</span>
</p>

<p>
最終確認：
<span id="eventSubCheckedAt">-</span>
</p>

</div>

</div>

  
<div class="buttons">

<button id="saveButton" type="button">
💾 保存
</button>

</div>

</div>

<script src="js/admin.js?v=20260802-1"></script>

</body>

</html>
