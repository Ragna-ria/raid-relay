<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="レイドでつなぐ生誕祭のイベントページです。"
    >

    <title>レイドでつなぐ生誕祭</title>

    <link
        rel="stylesheet"
        href="./css/style.css?v=0.1.0-04a"
    >
</head>

<body>

    <div class="siteContainer">

        <!-- ========================================
             ヘッダー
        ========================================= -->

        <header class="siteHeader">

            <p class="eventLabel">
                Twitch Raid Relay Event
            </p>

            <h1 id="eventTitle">
                レイドでつなぐ生誕祭
            </h1>

            <p
                id="eventDescription"
                class="eventDescription"
            ></p>

        </header>


        <!-- ========================================
             読み込み状態
        ========================================= -->

        <div
            id="loadingMessage"
            class="statusMessage"
            role="status"
        >
            イベント情報を読み込んでいます…
        </div>

        <div
            id="errorMessage"
            class="statusMessage errorMessage"
            role="alert"
            hidden
        ></div>


        <!-- ========================================
             メインコンテンツ
        ========================================= -->

        <main
            id="eventContent"
            class="eventContent"
            hidden
        >

            <!-- 現在・次の走者 -->

            <section
                class="runnerSummary"
                aria-label="現在と次の走者"
            >

                <article class="summaryCard currentCard">

                    <p class="summaryLabel">
                        現在の走者
                    </p>

                    <h2 id="currentRunnerName">
                        -
                    </h2>

                    <a
                        id="currentRunnerLink"
                        class="channelLink"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Twitchチャンネルを開く
                    </a>

                </article>


                <article class="summaryCard nextCard">

                    <p class="summaryLabel">
                        次の走者
                    </p>

                    <h2 id="nextRunnerName">
                        -
                    </h2>

                    <p
                        id="nextRunnerChannel"
                        class="channelName"
                    >
                        -
                    </p>

                </article>

            </section>


            <!-- Twitchプレイヤー -->

            <section
                class="playerSection"
                aria-labelledby="playerHeading"
            >

                <div class="sectionHeading">

                    <h2 id="playerHeading">
                        配信
                    </h2>

                    <button
                        id="reloadButton"
                        class="secondaryButton"
                        type="button"
                    >
                        再読み込み
                    </button>

                </div>

                <div
                    id="twitchPlayer"
                    class="twitchPlayer"
                ></div>

                <noscript>
                    このページを利用するにはJavaScriptを有効にしてください。
                </noscript>

            </section>


            <!-- 走者一覧 -->

            <section
                class="scheduleSection"
                aria-labelledby="scheduleHeading"
            >

                <div class="sectionHeading">

                    <h2 id="scheduleHeading">
                        走者一覧
                    </h2>

                    <p
                        id="updateStatus"
                        class="updateStatus"
                    >
                        -
                    </p>

                </div>

                <ol
                    id="runnerSchedule"
                    class="runnerSchedule"
                ></ol>

            </section>

        </main>


        <!-- ========================================
             フッター
        ========================================= -->

        <footer class="siteFooter">

            <p>
                このページはイベントの進行状況に合わせて自動更新されます。
            </p>

        </footer>

    </div>


    <!-- Twitch Embed SDK -->

    <script src="https://player.twitch.tv/js/embed/v1.js"></script>

    <!-- イベントページ本体 -->

    <script
        src="./js/app.js?v=0.1.0-04a"
        defer
    ></script>

</body>
</html>
